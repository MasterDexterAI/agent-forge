id: roman
prompt: >
  Create roman.py with to_roman(n: int) -> str and from_roman(s: str) -> int.
  Support 1 to 3999. to_roman raises ValueError outside that range.
  from_roman raises ValueError on invalid or non-canonical numerals like IIII or VX.
hidden_tests: |
  import pytest
  from roman import to_roman, from_roman

  @pytest.mark.parametrize("n,s", [(1,"I"),(4,"IV"),(9,"IX"),(40,"XL"),(90,"XC"),
                                   (400,"CD"),(900,"CM"),(1994,"MCMXCIV"),(3999,"MMMCMXCIX")])
  def test_to_roman(n, s):
      assert to_roman(n) == s

  @pytest.mark.parametrize("n,s", [(1,"I"),(4,"IV"),(1994,"MCMXCIV"),(3999,"MMMCMXCIX")])
  def test_from_roman(n, s):
      assert from_roman(s) == n

  def test_roundtrip():
      for n in range(1, 4000):
          assert from_roman(to_roman(n)) == n

  @pytest.mark.parametrize("bad", [0, 4000, -1])
  def test_to_roman_range(bad):
      with pytest.raises(ValueError):
          to_roman(bad)

  @pytest.mark.parametrize("bad", ["IIII", "VX", "", "ABC", "IL"])
  def test_from_roman_invalid(bad):
      with pytest.raises(ValueError):
          from_roman(bad)
