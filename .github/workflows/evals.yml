name: evals

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: smoke or full
        default: smoke
      repeats:
        description: runs per task
        default: "1"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      INTERNAL_API_KEY: unused
      STREAM_TOKEN_SECRET: unused
      SANDBOX_RUNTIME: runc
      WORKSPACE_ROOT: /tmp/agentforge-workspaces
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: docker build -t agentforge-sandbox:latest -f docker/sandbox.Dockerfile .
      - run: python -m evals.run --suite "${{ inputs.suite || 'full' }}" --repeats "${{ inputs.repeats || '2' }}" --out eval-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report
      - if: always()
        run: curl -fsS -H "Content-Type: application/json" -d @eval-report/discord.json "${{ secrets.DISCORD_WEBHOOK }}"
